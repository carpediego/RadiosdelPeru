name: Catalogo

# Cada 6 horas: prueba todas las emisoras y repara las URLs que hayan cambiado.
# Si todo esta bien, no hace nada. Si repara algo, hace commit y la app lo recoge sola.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar y reparar catalogo
        run: node tools/validate.mjs --fix

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain catalog/)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "radios-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/stations.json
          git commit -m "catalogo: validacion automatica"
          git push
